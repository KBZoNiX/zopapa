name: Build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:nano
          sketch-paths: |
            - src/zopapa
          libraries: |
            - source-path: src/libraries/DRV8833
            - source-path: src/libraries/ATRSensors
